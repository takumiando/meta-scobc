args:
  - --hw-description https://downloads.spacecubics.com/products/scobc-v1/releases/v2026.08/sdt/versal-scobc-v1-ve2302i.tar.gz
  - --machine-name versal-scobc-v1-ve2302i-reva-sdt-full
  - --require-machine scobc-v1-generic
  - -c meta-scobc/conf
  - -g full

machine:
  pre:
    include:
      comment: "Load the SC-OBC v1 Rev.A configuration"
      op: 'conf/machine/include/scobc-reva.inc'
  post:
    include:
      comment: "Load the dualboot U-Boot configuration when provided by meta-scobc-dualboot"
      op: 'conf/machine/include/${MACHINE}/uboot-config.conf'
