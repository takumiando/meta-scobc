args:
  - --hw-description https://downloads.spacecubics.com/developments/scobc-v1/releases/v2026.08/sdt/versal-scobc-v1-ve2002e.tar.gz
  - --machine-name versal-scobc-v1-ve2002e-sdt-full
  - --require-machine scobc-v1-generic
  - -c meta-scobc/conf
  - -g full

machine:
  pre:
  post:
    require:
      comment: "Load the SC-OBC v1 configuration for developer-grade devices"
      op: 'conf/machine/include/scobc-devgrade.inc'
    include:
      comment: "Load the dualboot U-Boot configuration when provided by meta-scobc-dualboot"
      op: 'conf/machine/include/scobc-v1-u-boot.conf'
